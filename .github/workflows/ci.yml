name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage
      - run: pnpm --filter @claviger/extension build
      - run: pnpm --filter @claviger/extension size:popup
      - run: pnpm --filter @claviger/extension build:firefox
      - run: pnpm --filter @claviger/extension lint:firefox
      - run: pnpm test:scripts
